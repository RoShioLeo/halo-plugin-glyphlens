apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: lemonslice-glyphlens
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: RoShioLeo
    website: https://www.lemonslice.cloud
  logo: logo.svg
  homepage: https://www.lemonslice.cloud/tools/glyphlens/
  repo: https://github.com/RoShioLeo/halo-plugin-glyphlens
  issues: https://github.com/RoShioLeo/halo-plugin-glyphlens/issues
  displayName: 字镜 · GlyphLens
  description: 面向 Halo 的字形转换工具，将繁体、异体字转换为常用简体，支持点选校对与统一字库维护。
  license:
    - name: MIT (original code)
      url: https://opensource.org/license/mit
