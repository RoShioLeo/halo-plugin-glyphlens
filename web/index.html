<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT; Copyright (c) 2026 RoShioLeo -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="字形转换，支持异体字转简体、繁体及文本文件转换。">
    <title>字镜 GlyphLens · 柠檬汽水池</title>
    <link rel="icon" href="img/glyphlens.svg" type="image/svg+xml">
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" type="module"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="shell">
        <header class="site-nav">
            <a class="back-blog" href="https://www.lemonslice.cloud/">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>主站</span>
            </a>
            <div class="site-tools">
                <a id="dictionaryAdmin" class="site-admin-link" href="/console/glyphlens-dictionary" target="_blank" rel="noopener noreferrer" hidden>字库管理</a>
                <div class="appearance">
                    <button type="button" id="appearanceToggle" class="appearance-toggle" aria-label="外观模式：跟随系统，点击切换为浅色" title="外观：跟随系统">
                        <svg data-color-mode-icon="system" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1.65 12.75 2.57 12.37M1.65 6.25 2.57 6.63M6.25 1.65 6.63 2.57M12.75 1.65 12.37 2.57"/><path d="M6.32 12.68a4.5 4.5 0 0 1 6.36-6.36"/><path d="M18.22 11.62a5.5 5.5 0 0 1-6.6 6.6 5.5 5.5 0 1 0 6.6-6.6Z"/><path d="M4 20 20 4"/>
                        </svg>
                        <svg data-color-mode-icon="light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
                        <svg data-color-mode-icon="dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M20.8 14A9 9 0 0 1 10 3.2 9 9 0 1 0 20.8 14Z"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main id="main-content">
            <div class="brand">
                <img class="brand-logo-light" src="img/glyphlens.svg" alt="" width="48" height="48">
                <img class="brand-logo-dark" src="img/glyphlens-dark.svg" alt="" width="48" height="48">
                <div class="brand-copy">
                    <p class="brand-kicker">GLYPHLENS</p>
                    <h1>字镜 · 字形转换</h1>
                </div>
            </div>
            <div class="controls">
                <fieldset class="field">
                    <legend>转换目标</legend>
                    <div class="segmented">
                        <input type="radio" name="direction" id="targetSimplified" value="v2s" checked>
                        <label for="targetSimplified">简体字</label>
                        <input type="radio" name="direction" id="targetTraditional" value="v2t">
                        <label for="targetTraditional">繁体字</label>
                        <span class="segmented-thumb" aria-hidden="true"></span>
                    </div>
                </fieldset>
                <fieldset class="field">
                    <legend>转换方式</legend>
                    <div class="segmented">
                        <input type="radio" name="mode" id="modeDefault" value="one2one" checked>
                        <label for="modeDefault">默认转换</label>
                        <input type="radio" name="mode" id="modeCandidates" value="one2many">
                        <label for="modeCandidates">多字候选</label>
                        <span class="segmented-thumb" aria-hidden="true"></span>
                    </div>
                </fieldset>
                <div class="file-actions">
                    <input type="file" id="fileInput" accept=".txt,text/plain" class="visually-hidden">
                    <button type="button" id="chooseFile">选择文件</button>
                    <button type="button" id="convertFile" disabled>转换并下载</button>
                </div>
            </div>
            <div class="workspace">
                <section class="text-panel">
                    <div class="panel-heading">
                        <label for="inputText">原文</label>
                        <div class="panel-actions">
                            <button type="button" id="clearText" class="quiet-button">清空</button>
                            <button type="button" id="convertText" class="primary-button">转换</button>
                        </div>
                    </div>
                    <textarea id="inputText" rows="13" spellcheck="false" placeholder="输入或粘贴文字"></textarea>
                </section>
                <section class="text-panel">
                    <div class="panel-heading">
                        <span id="outputLabel">转换结果</span>
                        <div class="panel-actions">
                            <button type="button" id="copyOutput" class="quiet-button" disabled>复制</button>
                            <button type="button" id="downloadOutput" class="quiet-button" disabled>下载</button>
                        </div>
                    </div>
                    <textarea id="outputText" rows="13" spellcheck="false" readonly aria-labelledby="outputLabel"></textarea>
                    <div id="reviewPanel" class="review-shell" hidden>
                        <div class="review-toolbar">
                            <span id="reviewStatus" role="status" aria-live="polite"></span>
                            <div class="review-navigation">
                                <button type="button" id="previousCandidate" class="quiet-button">上一处</button>
                                <button type="button" id="nextCandidate" class="quiet-button">下一处</button>
                            </div>
                        </div>
                        <div id="candidatePicker" class="candidate-picker" hidden>
                            <span id="candidateSource" class="candidate-source"></span>
                            <div id="candidateChoices" class="candidate-choices" role="group" aria-label="字形候选" aria-describedby="candidateKeyboardHelp"></div>
                            <span id="candidateKeyboardHelp" class="visually-hidden">数字键 1 至 9 选择候选；方向键跳转，Esc 关闭候选。</span>
                        </div>
                        <div id="reviewText" class="review-text" role="region" aria-labelledby="outputLabel"></div>
                    </div>
                </section>
            </div>
            <div class="bottom-actions">
                <p id="conversionStatus" role="status" aria-live="polite"></p>
            </div>
        </main>
        <footer class="source-credit">
            GlyphLens · LemonSlice ·
            <a href="https://github.com/RoShioLeo/halo-plugin-glyphlens" target="_blank" rel="noopener noreferrer">源码</a> ·
            <a href="LICENSE" rel="license">MIT</a>
        </footer>
    </div>
    <button type="button" class="feedback-launcher" id="openFeedback" aria-label="字形反馈" title="字形反馈" aria-haspopup="dialog" aria-controls="feedbackDialog">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><path d="M8 9h8M8 13h5"/></svg>
    </button>
    <dialog id="feedbackDialog" aria-labelledby="feedbackTitle">
        <form id="feedbackForm">
            <h2 id="feedbackTitle">字形反馈</h2>
            <label for="feedbackDirection">字库</label>
            <select id="feedbackDirection"><option value="common">通用字形</option><option value="v2s">简体字</option><option value="v2t">繁体字</option></select>
            <label for="feedbackCharacter">原字</label>
            <input id="feedbackCharacter" type="text" maxlength="10" required placeholder="请输入原字" autocomplete="off" aria-describedby="feedbackCharacterHelp feedbackCode">
            <small id="feedbackCharacterHelp">支持直接输入字形或 Unicode 码，例如：一、U+4E00、4E00。</small>
            <small id="feedbackCode"></small>
            <label for="feedbackCandidate">建议字形</label>
            <input id="feedbackCandidate" type="text" maxlength="10" placeholder="选填" autocomplete="off" aria-describedby="feedbackCandidateHelp">
            <small id="feedbackCandidateHelp">支持直接输入字形或 Unicode 码，例如：一、U+4E00、4E00。</small>
            <label for="feedbackNote">说明</label>
            <textarea id="feedbackNote" rows="3" maxlength="500"></textarea>
            <p id="feedbackStatus" role="status" aria-live="polite"></p>
            <div class="feedback-actions"><button type="button" id="cancelFeedback">取消</button><button type="submit" class="primary-button" id="submitFeedback">提交反馈</button></div>
        </form>
    </dialog>
</body>
</html>
